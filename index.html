<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مسح QR المخدوم</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style></style>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
    body { background: url('https://lh3.googleusercontent.com/d/1Th2BF-Xb5qQCUKYvr51aT1gx_ZVG52oY') no-repeat center center fixed; background-size: cover; margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 520px; width: 100%; background: rgba(253,251,247,0.94); backdrop-filter: blur(12px); padding: 25px 20px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); border: 2px solid #eab308; text-align: center; }
    h2 { font-size: 22px; color: #78350f; margin: 0 0 15px 0; }
    #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 2px solid #d97706; background: #000; min-height: 250px; }
    .hint { color: #475569; font-size: 14px; margin-top: 12px; }
    .btn { display: block; width: 100%; padding: 14px; margin-top: 12px; font-size: 16px; font-weight: 600; background: #b45309; color: #fff; border: none; border-radius: 14px; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #64748b; }
    #loading { display: none; padding: 30px 10px; color: #78350f; font-weight: 700; font-size: 18px; }
    .spinner { width: 45px; height: 45px; border: 4px solid #fde68a; border-top-color: #b45309; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { display: none; }
    .icon { font-size: 60px; margin-bottom: 10px; }
    .title { font-size: 22px; color: #1e293b; font-weight: 700; margin-bottom: 15px; }
    .name { font-size: 26px; color: #111827; font-weight: 700; margin-bottom: 15px; background: rgba(255,255,255,0.7); padding: 12px; border-radius: 14px; border: 1px dashed; }
    .status-tag { font-size: 15px; padding: 10px 14px; border-radius: 10px; display: inline-block; font-weight: 500; background: #fef3c7; color: #78350f; }
  </style>
</head>
<body>
  <div class="container">
    <div id="scanView">
      <h2>📷 مسح كارت المخدوم</h2>
      <div id="reader"></div>
      <div class="hint" id="hint">جاري تشغيل الكاميرا...</div>
    </div>

    <div id="loading"><div class="spinner"></div>جاري تسجيل الحضور...</div>

    <div id="result">
      <div class="icon" id="rIcon"></div>
      <div class="title" id="rTitle"></div>
      <div class="name" id="rName"></div>
      <div class="status-tag" id="rMsg"></div>
      <button class="btn" id="againBtn">📷 مسح شخص آخر</button>
    </div>
    <a href="https://script.google.com/macros/s/AKfycbzKOPh9KLNy3l-BwAzsgIwp55qlxIEXakYVOu2ouXb67uxekNRgMsINplqFN2t5QnH-/exec" class="btn secondary" target="_top">🏠 الرئيسية</a>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzKOPh9KLNy3l-BwAzsgIwp55qlxIEXakYVOu2ouXb67uxekNRgMsINplqFN2t5QnH-/exec";
    var html5QrCode = null;
    var busy = false;
    var COLORS = { success: "#16a34a", late: "#d97706", out: "#2563eb", warn: "#d97706", error: "#ef4444", closed: "#d97706" };

    function extractId(text) {
      text = (text || "").trim();
      var m = text.match(/[?&]id=([^&#]+)/);
      if (m) return decodeURIComponent(m[1]);
      if (/^[0-9A-Za-z_-]+$/.test(text)) return text;
      return "";
    }

    function show(id) {
      ["scanView", "loading", "result"].forEach(function(x) {
        document.getElementById(x).style.display = (x === id) ? "block" : "none";
      });
    }

    function startCamera() {
      show("scanView");
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScan,
        function() {}
      ).then(function() {
        document.getElementById("hint").innerText = "وجّه الكاميرا نحو الـ QR";
      }).catch(function(err) {
        document.getElementById("hint").innerText = "❌ تعذر الوصول للكاميرا: تأكد من إعطاء الإذن للمتصفح";
      });
    }

    function onScan(text) {
      if (busy) return;
      var id = extractId(text);
      if (!id) { document.getElementById("hint").innerText = "⚠️ الكود غير صالح، حاول مرة أخرى"; return; }
      busy = true;

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() {
          html5QrCode.clear();
          sendToBackend(id);
        }).catch(function() { sendToBackend(id); });
      } else {
        sendToBackend(id);
      }
    }

    function sendToBackend(id) {
      show("loading");
      
      fetch(GAS_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ id: id })
      })
      .then(response => {
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return response.json();
      })
      .then(renderResult)
      .catch(err => {
        console.error("Fetch error:", err);
        renderResult({ 
          kind: "error", 
          icon: "❌", 
          title: "حدث خطأ في الاتصال", 
          name: "", 
          message: "تأكد من إعدادات النشر ومطبقة لـ Anyone" 
        });
      });
    }

    function renderResult(r) {
      var color = COLORS[r.kind] || "#d97706";
      document.getElementById("rIcon").innerText = r.icon;
      document.getElementById("rIcon").style.color = color;
      document.getElementById("rTitle").innerText = r.title;
      var nameEl = document.getElementById("rName");
      nameEl.innerText = r.name;
      nameEl.style.display = r.name ? "block" : "none";
      nameEl.style.borderColor = color;
      var msgEl = document.getElementById("rMsg");
      msgEl.innerText = r.message;
      msgEl.style.display = r.message ? "inline-block" : "none";
      show("result");
    }

    document.getElementById("againBtn").addEventListener("click", function() {
      busy = false;
      startCamera();
    });

    window.addEventListener("DOMContentLoaded", startCamera);
  </script>
</body>
</html>
