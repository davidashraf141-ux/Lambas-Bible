<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>نظام الحضور والخدمة الذكي</title>
  <!-- مكتبة ماسح الـ QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <!-- مكتبة Google OAuth 2.0 Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: url('https://lh3.googleusercontent.com/d/1Th2BF-Xb5qQCUKYvr51aT1gx_ZVG52oY') no-repeat center center fixed;
      background-size: cover; margin: 0; padding: 20px; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 520px; width: 100%;
      background: rgba(253, 251, 247, 0.94); backdrop-filter: blur(12px);
      padding: 30px 22px; border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25); border: 2px solid #eab308;
      position: relative;
    }
    h2 { font-size: 22px; color: #78350f; text-align: center; margin: 0 0 20px 0; font-weight: 700; }
    
    /* User Profile Bar */
    .user-profile-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #fef3c7; border: 1px dashed #d97706; padding: 10px 14px;
      border-radius: 16px; margin-bottom: 18px;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #b45309; }
    .user-details { display: flex; flex-direction: column; font-size: 13px; color: #78350f; }
    .user-name { font-weight: 700; }
    .user-email { font-size: 11px; opacity: 0.85; word-break: break-all; }
    .logout-btn {
      background: #ef4444; color: #fff; border: none; padding: 6px 12px;
      border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    /* Navigation Tiles */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      min-height: 120px; background: rgba(255,255,255,0.9); border: 2px solid #f59e0b;
      border-radius: 20px; text-decoration: none; color: #78350f; font-weight: 700; font-size: 16px;
      text-align: center; cursor: pointer; transition: 0.15s;
    }
    .tile:active { transform: scale(0.96); background: #fef3c7; }
    .tile .ico { font-size: 38px; }
    .tile.wide { grid-column: span 2; }
    .tile.primary { background: #b45309; color: #fff; border-color: #92400e; }

    /* UI Elements */
    input[type="text"], input[type="password"], input[type="time"], input[type="number"] {
      width: 100%; padding: 14px; font-size: 15px; border: 2px solid #d97706; border-radius: 14px;
      outline: none; text-align: center; margin-bottom: 15px; font-weight: 600; background: #fff;
    }
    .btn {
      display: block; width: 100%; padding: 14px; margin-top: 10px; font-size: 16px; font-weight: 600;
      background: #b45309; color: #fff; border: none; border-radius: 14px; cursor: pointer; text-align: center;
      transition: 0.2s;
    }
    .btn:hover { background: #92400e; }
    .btn.secondary { background: #64748b; }
    
    /* Live Camera Container */
    .camera-wrapper {
      border: 2px solid #d97706; border-radius: 20px; overflow: hidden;
      background: #000; position: relative; margin-bottom: 15px; min-height: 280px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #qr-reader { width: 100%; }
    .camera-status {
      color: #78350f; font-size: 14px; text-align: center; font-weight: 600; margin-top: 8px;
    }
    
    /* Result Display */
    .icon { font-size: 60px; margin-bottom: 10px; text-align: center; }
    .title { font-size: 22px; color: #1e293b; font-weight: 700; margin-bottom: 15px; text-align: center; }
    .name { font-size: 24px; color: #111827; font-weight: 700; margin-bottom: 15px; background: rgba(255,255,255,0.8); padding: 12px; border-radius: 14px; border: 1px dashed #d97706; text-align: center; }
    .status-tag { font-size: 15px; padding: 10px 14px; border-radius: 10px; display: block; font-weight: 600; background: #fef3c7; color: #78350f; text-align: center; margin-bottom: 15px; }

    /* Loader */
    .loader { display: none; text-align: center; padding: 30px 10px; color: #78350f; font-weight: 700; font-size: 18px; }
    .spinner { width: 45px; height: 45px; border: 4px solid #fde68a; border-top-color: #b45309; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Floating Home Button */
    .home-btn {
      position: fixed; bottom: 18px; left: 18px; z-index: 999; background: #78350f; color: #fff;
      padding: 12px 18px; border-radius: 30px; font-weight: 700; font-size: 15px; box-shadow: 0 6px 16px rgba(0,0,0,.35);
      cursor: pointer; border: none; display: flex; align-items: center; gap: 6px;
    }

    .suggestion-btn {
      display: flex; align-items: center; width: 100%; text-align: right; padding: 14px; margin: 8px 0;
      background: rgba(255, 255, 255, 0.9); border: 1px solid #f59e0b; border-radius: 14px; cursor: pointer;
      font-size: 16px; color: #1e293b; font-weight: 600;
    }
    
    .days-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .day-chip { position: relative; flex: 1 1 30%; }
    .day-chip input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .day-chip label { display: block; padding: 10px 8px; text-align: center; font-weight: 600; font-size: 13px; color: #78350f; background: #fef3c7; border: 2px solid #fde68a; border-radius: 10px; cursor: pointer; }
    .day-chip input:checked + label { background: #b45309; border-color: #92400e; color: #fff; }
  </style>
</head>
<body>

  <button id="homeBtn" class="home-btn" style="display:none;" onclick="showView('dashboardView')">🏠 الرئيسية</button>

  <div class="container">

    <!-- 0. شاشة تسجيل الدخول Google OAuth -->
    <div id="loginView">
      <h2>🔐 تسجيل الدخول للنظام</h2>
      <p style="text-align: center; color: #78350f; font-weight: 600; margin-bottom: 20px;">
        يرجى تسجيل الدخول بحساب Google المصرح له للبدء في استخدام النظام
      </p>
      <div id="g_id_onload"
        data-client_id="759295584482-3qpocftq0uk3du9s3g77pi91apt323im.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
      </div>
      <div style="display: flex; justify-content: center; margin-top: 15px;">
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
      </div>
      <div id="loginError" style="color:#ef4444; font-weight:bold; text-align:center; margin-top:15px; display:none;"></div>
    </div>

    <!-- 1. لوحة التحكم (Dashboard) -->
    <div id="dashboardView" style="display:none;">
      <!-- شريط معلومات الخادم -->
      <div class="user-profile-bar">
        <div class="user-info">
          <img id="uAvatar" class="user-avatar" src="" alt="User Avatar">
          <div class="user-details">
            <span id="uName" class="user-name">الاسم</span>
            <span id="uEmail" class="user-email">email@gmail.com</span>
          </div>
        </div>
        <button class="logout-btn" onclick="logoutUser()">خروج 🚪</button>
      </div>

      <h2>🏠 لوحة التحكم</h2>
      <div class="grid">
        <button class="tile primary" onclick="showView('scanView')"><span class="ico">📷</span>مسح QR مباشر</button>
        <button class="tile" onclick="showView('searchView')"><span class="ico">🔍</span>تحضير بالاسم</button>
        <button class="tile" onclick="showView('settingsView')"><span class="ico">⚙️</span>الإعدادات</button>
        <button class="tile" onclick="openSheet()"><span class="ico">📊</span>فتح الشيت</button>
        <button class="tile wide" onclick="showView('addView')"><span class="ico">➕</span>إضافة مخدوم جديد</button>
      </div>
    </div>

    <!-- 2. صفحة مسح الـ QR المباشرة عبر الكاميرا -->
    <div id="scanView" style="display:none;">
      <h2>📷 المسح المباشر لكارت المخدوم</h2>
      <div class="camera-wrapper">
        <div id="qr-reader"></div>
      </div>
      <div class="camera-status" id="cameraStatus">جاري تشغيل الكاميرا...</div>
      <button class="btn secondary" style="margin-top:15px;" onclick="restartScanner()">🔄 إعادة تشغيل الكاميرا</button>
    </div>

    <!-- 3. صفحة التحضير بالاسم -->
    <div id="searchView" style="display:none;">
      <h2>🔍 التحضير السريع بالاسم</h2>
      <input type="text" id="searchNameInput" placeholder="اكتب الاسم هنا..." autocomplete="off">
      <button class="btn" onclick="executeSearch()">بحث</button>
      <div id="searchResults" style="margin-top:20px;"></div>
    </div>

    <!-- 4. صفحة إضافة مخدوم -->
    <div id="addView" style="display:none;">
      <h2>➕ إضافة مخدوم جديد</h2>
      <input type="text" id="newStudentName" placeholder="اسم المخدوم ثلاثي..." autocomplete="off">
      <button class="btn" onclick="submitNewStudent()">حفظ وتوليد الكارت 🎨</button>
      <div id="addResult" style="margin-top:15px; text-align:center;"></div>
    </div>

    <!-- 5. صفحة الإعدادات -->
    <div id="settingsView" style="display:none;">
      <h2>🔒 إعدادات النظام</h2>
      <div id="settingsLock">
        <input type="password" id="gatePassword" placeholder="ادخل كلمة المرور">
        <button class="btn" onclick="unlockSettings()">دخول</button>
      </div>

      <div id="settingsForm" style="display:none;">
        <label style="font-weight:bold; color:#78350f;">موعد بدء الاجتماع</label>
        <input type="time" id="cfgStartTime">
        <label style="font-weight:bold; color:#78350f;">موعد نهاية الاجتماع</label>
        <input type="time" id="cfgEndTime">
        <label style="font-weight:bold; color:#78350f;">مدة السماح بالتأخير (دقائق)</label>
        <input type="number" id="cfgAcceptedDelay">

        <label style="font-weight:bold; color:#78350f;">الأيام المسموحة</label>
        <div class="days-grid">
          <div class="day-chip"><input type="checkbox" id="day0" value="0"><label for="day0">الأحد</label></div>
          <div class="day-chip"><input type="checkbox" id="day1" value="1"><label for="day1">الاثنين</label></div>
          <div class="day-chip"><input type="checkbox" id="day2" value="2"><label for="day2">الثلاثاء</label></div>
          <div class="day-chip"><input type="checkbox" id="day3" value="3"><label for="day3">الأربعاء</label></div>
          <div class="day-chip"><input type="checkbox" id="day4" value="4"><label for="day4">الخميس</label></div>
          <div class="day-chip"><input type="checkbox" id="day5" value="5"><label for="day5">الجمعة</label></div>
          <div class="day-chip"><input type="checkbox" id="day6" value="6"><label for="day6">السبت</label></div>
        </div>

        <label style="font-weight:bold; color:#78350f;">كلمة مرور جديدة (اختياري)</label>
        <input type="password" id="cfgNewPassword" placeholder="اتركها فارغة للإبقاء على الحالية">

        <button class="btn" onclick="saveSettings()">💾 حفظ الإعدادات</button>
      </div>
    </div>

    <!-- شاشة التحميل العام -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div id="loaderText">جاري معالجة الطلب...</div>
    </div>

    <!-- شاشة عرض النتيجة -->
    <div id="resultView" style="display:none;">
      <div class="icon" id="rIcon">✓</div>
      <div class="title" id="rTitle">تم التسجيل</div>
      <div class="name" id="rName">الاسم</div>
      <div class="status-tag" id="rMsg">تفاصيل</div>
      <button class="btn" onclick="showView('scanView')">📷 مسح آخر</button>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyPnUu7R0VaCrwyEYYW_YvyVI0q4g96OZLC9z5-MwTuL8Scw-0xa-_6-SfqCjgWw7KT/exec";
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1jqkN7v_0Uk3m3p_gfoXRdF4Q1c9XDXank1fnVmsm7jU/edit?usp=sharing";

    var currentUser = null;
    var html5QrCode = null;
    var isScannerRunning = false;
    var verifiedPassword = "";

    // JWT Decoder Helper
    function parseJwt(token) {
      try {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) {
        return null;
      }
    }

    // Auth & Startup Flow
    window.addEventListener("DOMContentLoaded", async function() {
      const savedUser = localStorage.getItem("app_user");
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          showLoader("جاري التحقق من صلاحيات الحساب...");
          const authRes = await apiCall("check_auth", { email: currentUser.email });
          if (authRes.authorized) {
            setupUserProfileUI();
            checkDirectUrlScan();
          } else {
            logoutUser("❌ الحساب غير مصرح له بفتح النظام.");
          }
        } catch (e) {
          logoutUser();
        }
      } else {
        showView('loginView');
      }
    });

    async function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) {
        showLoginError("تعذر قراءة بيانات حساب Google");
        return;
      }

      showLoader("جاري التحقق من صلاحية البريد الإلكتروني...");
      const authRes = await apiCall("check_auth", { email: payload.email });

      if (authRes.authorized) {
        currentUser = {
          email: payload.email.toLowerCase().trim(),
          name: payload.name || payload.email,
          picture: payload.picture || "https://lh3.googleusercontent.com/a/default-user"
        };
        localStorage.setItem("app_user", JSON.stringify(currentUser));
        setupUserProfileUI();
        checkDirectUrlScan();
      } else {
        showLoginError("❌ عذراً، البريد الإلكتروني (" + payload.email + ") غير مصرح له بالدخول.");
      }
    }

    function setupUserProfileUI() {
      if (!currentUser) return;
      document.getElementById("uName").innerText = currentUser.name;
      document.getElementById("uEmail").innerText = currentUser.email;
      document.getElementById("uAvatar").src = currentUser.picture;
      document.getElementById("homeBtn").style.display = "flex";
      showView('dashboardView');
    }

    function logoutUser(msg) {
      localStorage.removeItem("app_user");
      currentUser = null;
      stopLiveScanner();
      document.getElementById("homeBtn").style.display = "none";
      if (msg) showLoginError(msg);
      showView('loginView');
    }

    function showLoginError(msg) {
      var errDiv = document.getElementById("loginError");
      errDiv.innerText = msg;
      errDiv.style.display = "block";
      showView('loginView');
    }

    function checkDirectUrlScan() {
      var urlParams = new URLSearchParams(window.location.search);
      var scannedId = urlParams.get("id");
      if (scannedId) {
        processScannedText(scannedId);
      }
    }

    function openSheet() {
      window.open(GOOGLE_SHEET_URL, "_blank");
    }

    // View Navigation Logic
    function showView(viewId) {
      if (viewId !== "scanView") {
        stopLiveScanner();
      }

      ["loginView", "dashboardView", "scanView", "searchView", "addView", "settingsView", "loader", "resultView"].forEach(function(id) {
        document.getElementById(id).style.display = (id === viewId) ? "block" : "none";
      });

      if (viewId === "scanView") {
        startLiveScanner();
      }
    }

    function showLoader(text) {
      document.getElementById("loaderText").innerText = text || "جاري التحميل...";
      showView("loader");
    }

    function renderResult(r) {
      var COLORS = { success: "#16a34a", late: "#d97706", out: "#2563eb", warn: "#d97706", error: "#ef4444", closed: "#d97706" };
      var color = COLORS[r.kind] || "#d97706";
      document.getElementById("rIcon").innerText = r.icon || "ℹ️";
      document.getElementById("rIcon").style.color = color;
      document.getElementById("rTitle").innerText = r.title || "";
      var nameEl = document.getElementById("rName");
      nameEl.innerText = r.name || "";
      nameEl.style.display = r.name ? "block" : "none";
      var msgEl = document.getElementById("rMsg");
      msgEl.innerText = r.message || "";
      msgEl.style.display = r.message ? "block" : "none";
      showView("resultView");
    }

    // API Caller
    async function apiCall(action, payload = {}) {
      try {
        payload.action = action;
        if (currentUser && currentUser.email) {
          payload.email = currentUser.email;
        }
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        return { success: false, kind: "error", icon: "❌", title: "خطأ بالاتصال", message: e.toString() };
      }
    }

    // Live Camera QR Scanning Logic
    function startLiveScanner() {
      if (isScannerRunning) return;
      document.getElementById("cameraStatus").innerText = "🎥 جاري تشغيل الكاميرا المباشرة...";
      
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
        .then(() => {
          isScannerRunning = true;
          document.getElementById("cameraStatus").innerText = "📸 الكاميرا تعمل الآن، ضع الـ QR أمام العدسة";
        })
        .catch((err) => {
          isScannerRunning = false;
          document.getElementById("cameraStatus").innerText = "❌ تعذر فتح الكاميرا: تأكد من منح صلاحية الوصول للكاميرا";
        });
    }

    function stopLiveScanner() {
      if (html5QrCode && isScannerRunning) {
        html5QrCode.stop().then(() => {
          isScannerRunning = false;
        }).catch(err => console.error(err));
      }
    }

    function restartScanner() {
      stopLiveScanner();
      setTimeout(startLiveScanner, 300);
    }

    function onScanSuccess(decodedText, decodedResult) {
      stopLiveScanner();
      processScannedText(decodedText);
    }

    function onScanError(errorMessage) {
      // Ignored for continuous scanning
    }

    function extractId(text) {
      text = (text || "").trim();
      var m = text.match(/[?&]id=([^&#]+)/);
      if (m) return decodeURIComponent(m[1]);
      if (/^[0-9A-Za-z_-]+$/.test(text)) return text;
      return "";
    }

    async function processScannedText(text) {
      var id = extractId(text);
      if (!id) {
        renderResult({ kind: "error", icon: "⚠️", title: "كود غير صالح", message: "تأكد من مسح كارت كود صحيح" });
        return;
      }
      showLoader("جاري تسجيل الحضور...");
      const res = await apiCall("scan", { id: id, email: currentUser ? currentUser.email : "" });
      renderResult(res);
    }

    // Search Logic
    async function executeSearch() {
      var name = document.getElementById("searchNameInput").value.trim();
      var resDiv = document.getElementById("searchResults");
      if (!name) { resDiv.innerHTML = "<p style='color:#ef4444; text-align:center;'>⚠️ يرجى إدخال اسم</p>"; return; }

      resDiv.innerHTML = "<div style='text-align:center; padding:10px;'><div class='spinner' style='width:25px;height:25px;'></div>جاري البحث...</div>";
      const res = await apiCall("search", { name: name });

      resDiv.innerHTML = "";
      if (res.status === "exact_match") {
        processScannedText(res.id);
      } else if (res.status === "suggestions") {
        resDiv.innerHTML = "<div style='font-weight:bold; color:#b45309; margin-bottom:8px;'>💡 النتائج المقترحة:</div>";
        res.matches.forEach(function(item) {
          var btn = document.createElement("button");
          btn.className = "suggestion-btn";
          btn.innerText = "👤 " + item.name;
          btn.onclick = function() { processScannedText(item.id); };
          resDiv.appendChild(btn);
        });
      } else {
        resDiv.innerHTML = "<p style='color:#ef4444; text-align:center;'>❌ لم نجد نتائج مطابقة</p>";
      }
    }

    // Add Student Logic
    async function submitNewStudent() {
      var name = document.getElementById("newStudentName").value.trim();
      if (!name) { alert("يرجى كتابة اسم المخدوم"); return; }

      showLoader("جاري التسجيل وإنشاء الكارت...");
      const res = await apiCall("add_student", { name: name, email: currentUser ? currentUser.email : "" });

      if (res.success) {
        var html = "<p style='color:#16a34a; font-weight:bold;'>🎉 تم إنشاء المخدوم بنجاح!</p>";
        if (res.driveUrl) {
          html += "<a href='" + res.driveUrl + "' target='_blank' class='btn' style='background:#2563eb;'>📁 فتح الكارت في Google Drive</a>";
        }
        document.getElementById("addResult").innerHTML = html;
        document.getElementById("newStudentName").value = "";
        showView("addView");
      } else {
        alert("فشل الإضافة: " + res.message);
        showView("addView");
      }
    }

    // Settings Logic
    async function unlockSettings() {
      var pw = document.getElementById("gatePassword").value;
      if (!pw) return;
      showLoader("جاري التحقق...");
      const res = await apiCall("verify_settings_password", { password: pw });
      if (res.valid) {
        verifiedPassword = pw;
        document.getElementById("settingsLock").style.display = "none";
        document.getElementById("settingsForm").style.display = "block";
        loadSettingsData();
      } else {
        alert("❌ كلمة المرور غير صحيحة");
        showView("settingsView");
      }
    }

    async function loadSettingsData() {
      showLoader("جاري تحميل الإعدادات...");
      const res = await apiCall("get_settings");
      if (res.success) {
        var s = res.settings;
        document.getElementById("cfgStartTime").value = s.startTime;
        document.getElementById("cfgEndTime").value = s.endTime;
        document.getElementById("cfgAcceptedDelay").value = s.acceptedDelay;
        var days = s.allowedDays || [0,1,2,3,4,5,6];
        for (let d = 0; d <= 6; d++) {
          document.getElementById("day" + d).checked = days.includes(d);
        }
        showView("settingsView");
      }
    }

    async function saveSettings() {
      var allowedDays = [];
      for (let d = 0; d <= 6; d++) {
        if (document.getElementById("day" + d).checked) allowedDays.push(d);
      }
      showLoader("جاري حفظ الإعدادات...");
      const res = await apiCall("save_settings", {
        password: verifiedPassword,
        startTime: document.getElementById("cfgStartTime").value,
        endTime: document.getElementById("cfgEndTime").value,
        acceptedDelay: document.getElementById("cfgAcceptedDelay").value,
        newPassword: document.getElementById("cfgNewPassword").value,
        allowedDays: allowedDays
      });
      alert(res.message);
      if (res.success) {
        if (document.getElementById("cfgNewPassword").value) {
          verifiedPassword = document.getElementById("cfgNewPassword").value;
        }
        document.getElementById("cfgNewPassword").value = "";
      }
      showView("settingsView");
    }
  </script>
</body>
</html>
