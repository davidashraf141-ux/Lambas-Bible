<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مسح QR المخدوم</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الحضور">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209990.png">
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("PWA Service Worker registered:", reg.scope))
          .catch((err) => console.error("SW Registration failed:", err));
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: url("https://lh3.googleusercontent.com/d/1Th2BF-Xb5qQCUKYvr51aT1gx_ZVG52oY"); margin: 0; padding: 20px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 520px; width: 100%; background: #ffffff; padding: 25px 20px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; text-align: center; }
    h2 { font-size: 20px; color: #1e293b; margin: 0 0 15px 0; }
    #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 2px solid #cbd5e1; background: #000; min-height: 250px; }
    .hint { color: #64748b; font-size: 14px; margin-top: 12px; }
    .btn { display: block; width: 100%; padding: 14px; margin-top: 12px; font-size: 16px; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 12px; cursor: pointer; text-decoration: none; }
    .btn-logout { background: #e2e8f0; color: #475569; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; float: left; }
    
    #loginView, #scanView, #loading, #result { display: none; }
    #loginView { display: block; }

    #loading { padding: 30px 10px; color: #1e293b; font-weight: 700; font-size: 18px; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .icon { font-size: 50px; margin-bottom: 10px; }
    .title { font-size: 20px; color: #1e293b; font-weight: 700; margin-bottom: 10px; }
    .name { font-size: 22px; color: #0f172a; font-weight: 700; margin-bottom: 15px; padding: 10px; background: #f1f5f9; border-radius: 10px; }
    .status-tag { font-size: 14px; padding: 8px 12px; border-radius: 8px; display: inline-block; font-weight: 500; }
    .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f8fafc; padding: 8px 12px; border-radius: 10px; font-size: 13px; color: #334155; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. LOGIN VIEW -->
    <div id="loginView">
      <h2>🔐 تسجيل الدخول لمسح الحضور</h2>
      <p class="hint" style="margin-bottom: 20px;">قم بتسجيل الدخول مرة واحدة فقط بحسابك المعتمد</p>
      <button class="btn" id="loginBtn">تسجيل الدخول بواسطة Google 🚀</button>
      <div class="hint" id="loginHint" style="color:#ef4444; margin-top:10px;"></div>
    </div>

    <!-- 2. SCANNER VIEW -->
    <div id="scanView">
      <div class="user-header">
        <span id="userEmail"></span>
        <button class="btn-logout" onclick="logout()">خروج</button>
      </div>
      <h2>📷 مسح كارت المخدوم</h2>
      <div id="reader"></div>
      <div class="hint" id="hint">جاري طلب إذن الكاميرا...</div>
    </div>

    <!-- 3. LOADING VIEW -->
    <div id="loading">
      <div class="spinner"></div>
      جاري التحقق وتسجيل الحضور...
    </div>

    <!-- 4. RESULT VIEW -->
    <div id="result">
      <div class="icon" id="rIcon"></div>
      <div class="title" id="rTitle"></div>
      <div class="name" id="rName"></div>
      <div class="status-tag" id="rMsg"></div>
      <button class="btn" id="againBtn">📷 مسح شخص آخر</button>
    </div>

  </div>

  <script>
    const CLIENT_ID = "759295584482-3qpocftq0uk3du9s3g77pi91apt323im.apps.googleusercontent.com";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzKOPh9KLNy3l-BwAzsgIwp55qlxIEXakYVOu2ouXb67uxekNRgMsINplqFN2t5QnH-/exec";

    var tokenClient = null;
    var html5QrCode = null;
    var busy = false;

    function show(id) {
      ["loginView", "scanView", "loading", "result"].forEach(function(x) {
        document.getElementById(x).style.display = (x === id) ? "block" : "none";
      });
    }

    function initGoogleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/userinfo.email",
        callback: (tokenResponse) => {
          if (tokenResponse.error !== undefined) {
            document.getElementById("loginHint").innerText = "❌ فشل تسجيل الدخول: " + tokenResponse.error;
            return;
          }
          
          // Save token persistently
          localStorage.setItem("user_access_token", tokenResponse.access_token);
          fetchUserInfo(tokenResponse.access_token);
        },
      });
    }

    function fetchUserInfo(token) {
  fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(res => {
    if (!res.ok) throw new Error("Expired Token");
    return res.json();
  })
  .then(user => {
    const userEmail = (user.email || "").toLowerCase().trim();
    
    // Save details in local storage
    localStorage.setItem("user_email", userEmail);
    document.getElementById("userEmail").innerText = "👤 " + userEmail;

    // --- INSTANT EMAIL CHECK AFTER LOGIN ---
    verifyEmailWithBackend(userEmail);
  })
  .catch(() => {
    logout();
  });
}

function verifyEmailWithBackend(email) {
    show("loading");
  
    // Ping backend with action: "check_auth"
    fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ 
        action: "check_auth", 
        scannerEmail: email 
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.authorized) {
        // Authorized! Proceed to camera
        startCamera();
      } else {
        // Not authorized: Show error and stop
        renderResult({
          kind: "error",
          icon: "🚫",
          title: "حساب غير مصرح له",
          name: email,
          message: "هذا الحساب غير موجود في قائمة الخدام المصرح لهم بالمسح"
        });
      }
    })
    .catch(err => {
      renderResult({
        kind: "error",
        icon: "❌",
        title: "خطأ في التحقق",
        name: "",
        message: err.message
      });
    });
  }

    

    // Auto-login check on page load
    function checkSavedSession() {
      var savedToken = localStorage.getItem("user_access_token");
      var savedEmail = localStorage.getItem("user_email");

      if (savedToken && savedEmail) {
        document.getElementById("userEmail").innerText = "👤 " + savedEmail;
        fetchUserInfo(savedToken); // Validates if token is still good
      } else {
        show("loginView");
      }
    }

    function logout() {
      localStorage.removeItem("user_access_token");
      localStorage.removeItem("user_email");
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => show("loginView"));
      } else {
        show("loginView");
      }
    }

    document.getElementById("loginBtn").addEventListener("click", function() {
      if (!tokenClient) initGoogleAuth();
      tokenClient.requestAccessToken();
    });

    function startCamera() {
      show("scanView");
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(function(devices) {
        var selectedCamId = (devices && devices.length > 0) ? devices[0].id : null;
        for (var i = 0; i < devices.length; i++) {
          if (/back|rear|environment/i.test(devices[i].label)) {
            selectedCamId = devices[i].id;
            break;
          }
        }

        var config = selectedCamId ? selectedCamId : { facingMode: "environment" };

        html5QrCode.start(
          config,
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScan,
          function() {}
        ).then(function() {
          document.getElementById("hint").innerText = "وجّه الكاميرا نحو الـ QR";
        }).catch(function(err) {
          document.getElementById("hint").innerText = "❌ تعذر تشغيل الكاميرا: " + err;
        });
      }).catch(function() {
        showFallbackCamera();
      });
    }

    function showFallbackCamera() {
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScan,
        function() {}
      ).then(function() {
        document.getElementById("hint").innerText = "وجّه الكاميرا نحو الـ QR";
      }).catch(function(err) {
        document.getElementById("hint").innerText = "❌ تعذر تشغيل الكاميرا";
      });
    }

    function onScan(text) {
      if (busy) return;
      var id = (text || "").trim();
      var m = id.match(/[?&]id=([^&#]+)/);
      if (m) id = decodeURIComponent(m[1]);

      if (!id) return;
      busy = true;

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => sendToBackend(id)).catch(() => sendToBackend(id));
      } else {
        sendToBackend(id);
      }
    }

    // 3. Send ID + Scanner Email to Backend
    function sendToBackend(id) {
      show("loading");

      var scannerEmail = localStorage.getItem("user_email") || "";

      fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ 
          id: id, 
          scannerEmail: scannerEmail 
        })
      })
      .then(res => res.json())
      .then(renderResult)
      .catch(err => {
        renderResult({
          kind: "error",
          icon: "❌",
          title: "خطأ في الاتصال",
          name: "",
          message: err.message
        });
      });
    }

    function renderResult(r) {
      document.getElementById("rIcon").innerText = r.icon || "ℹ️";
      document.getElementById("rTitle").innerText = r.title || "";
      
      var nameEl = document.getElementById("rName");
      nameEl.innerText = r.name || "";
      nameEl.style.display = r.name ? "block" : "none";

      var msgEl = document.getElementById("rMsg");
      msgEl.innerText = r.message || "";
      msgEl.style.display = r.message ? "inline-block" : "none";

      show("result");
    }

    document.getElementById("againBtn").addEventListener("click", function() {
      busy = false;
      startCamera();
    });

    window.addEventListener("DOMContentLoaded", function() {
      var interval = setInterval(function() {
        if (window.google && window.google.accounts) {
          clearInterval(interval);
          initGoogleAuth();
          checkSavedSession();
        }
      }, 100);
    });
  </script>
</body>
</html>
